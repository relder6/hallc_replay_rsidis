
name: Deploy Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir site
          cp AUX_FILES/rsidis_bigtable_pass1.html site/
          cp AUX_FILES/rsidis_bigtable_pass1.csv site/

          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>RSIDIS Analysis</title>
          </head>
          <body>
            <h1>RSIDIS Analysis</h1>
            <p>
              <a href="rsidis_bigtable_pass1.html">
                RSIDIS Big Table — Pass 1
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
